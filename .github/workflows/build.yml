
name: Build TmPixel Crystal Adventures

on:
  workflow_dispatch:
  push:
    paths:
      - 'TmPixelCrystalAdventures-GitHubBuild.zip'
      - 'project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          if [ -f project.zip ]; then
            ZIP_FILE=project.zip
          else
            ZIP_FILE=TmPixelCrystalAdventures-GitHubBuild.zip
          fi
          unzip -q "$ZIP_FILE" -d extracted
          find extracted -name build.gradle -print

      - name: Build plugin
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name build.gradle -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TmPixelCrystalAdventures-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
