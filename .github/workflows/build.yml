name: Build TmPixel Crystal Adventures

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found in repository root"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          echo "Project files:"
          find extracted -maxdepth 4 \( -name build.gradle -o -name build.gradle.kts \) -print

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          BUILD_FILE="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside ZIP"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cd "$PROJECT_DIR"
          gradle clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TmPixelCrystalAdventures-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
